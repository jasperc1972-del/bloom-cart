# 寄信設定範本：複製成 config/mail.yml 後填入自己的值
# config/ 已在 .gitignore，填好的檔案不會被上傳
# 沒有 config/mail.yml、或 app.mail.from 留空 → 網站照常運作，只是不寄通知信
#
# Gmail 用法：Google 帳戶 → 安全性 → 開啟兩步驟驗證 → 「應用程式密碼」產生 16 碼密碼填到 password
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: 填入寄件 Gmail 帳號
    password: "填入 16 碼應用程式密碼"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  mail:
    # 寄件人地址（Gmail 通常要跟 username 相同）
    from: 填入寄件 Gmail 帳號
  payment:
    # 待付款通知信中的匯款資訊；bank-account 留空就改寫「付款方式請洽朵拉花店」
    bank-name: 填入銀行名稱與代碼
    bank-account: 填入匯款帳號
    account-name: 填入戶名
