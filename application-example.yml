# 設定範本：複製成 config/application.yml 後填入自己的值
# config/ 已在 .gitignore，填好的檔案不會被上傳
server:
  port: 填入網站埠號

spring:
  datasource:
    url: jdbc:mysql://填入主機:填入埠號/dora_floral?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei
    username: 填入資料庫帳號
    password: "填入資料庫密碼"

app:
  # 一鍵啟動（啟動朵拉花店.bat）完成後要開啟的網址，例如 http://主機:網站埠號
  site-url: 填入網站網址
  admin:
    # 首次啟動自動建立的管理員；不填就不建立
    username: 填入管理員帳號
    password: "填入管理員密碼（至少 8 字）"
